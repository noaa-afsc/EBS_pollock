name: gitleaks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          # SHA-256 from the corresponding official release checksums file.
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          cd "$work"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error \
            --location --retry 3 --max-time 120 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          checksum="$(sha256sum "$archive")"
          if [[ "${checksum%% *}" != "$sha256" ]]; then
            echo "Gitleaks archive checksum did not match the pinned release" >&2
            exit 1
          fi
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
      - name: Scan Git history
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse --verify 'HEAD^{commit}')"
          range="$head"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$(git rev-parse --verify "${PR_BASE_SHA:?Missing pull request base}^{commit}")"
            git merge-base --is-ancestor "$base" "$head"
            range="$base..$head"
          fi
          # Include merge patches to cover content introduced during conflict resolution.
          "$RUNNER_TEMP/gitleaks" git --no-banner --no-color --redact=100 \
            --log-opts="--no-ext-diff --no-textconv --diff-merges=first-parent $range" .
